name: Build, Test & Pack

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SanketDesk.sln

      - name: Build solution (Release)
        run: dotnet build SanketDesk.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test tests/SanketDesk.Tests/SanketDesk.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack NuGet packages
        run: dotnet pack SanketDesk.sln --configuration Release --no-build --output artifacts
